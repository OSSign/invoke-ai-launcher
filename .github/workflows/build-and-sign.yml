name: Build and Sign

on:
  workflow_dispatch:
    inputs:

      source_branch:
        description: 'The source branch or ref to build from'
        default: 'main'
        required: true

      release_name:
        description: 'The name for the release'
        required: true


env:
  SOURCE_REPOSITORY: 'Invoke-AI/launcher'
  SOURCE_REPOSITORY_NAME: 'launcher'
  NODE_VERSION: '22'


jobs:
  # x64 and arm64 build and sign independently (each needs the OSSign environment's reviewer approval, which
  # GitHub grants per job, so both prompts appear at once). Neither publishes: the `release` job below
  # publishes both sets in one step, so a release only ever appears when every build succeeded.
  build:
    runs-on: windows-2022
    
    permissions:
      contents: write

    environment: OSSign
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ github.event.inputs.source_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Generate lockfile hash without version
        id: lockfile-hash
        shell: bash
        run: echo "hash=$(node .github/scripts/generate-lockfile-hash.js)" >> $GITHUB_OUTPUT

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.electron
            ~/.electron-gyp
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-modules-${{ steps.lockfile-hash.outputs.hash }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Get UV hash
        id: uv-hash
        shell: bash
        run: |
          echo "hash=$(node -e "console.log(require('./package.json').uv.win.sha256)")" >> $GITHUB_OUTPUT

      - name: Cache UV binaries
        id: cache-uv
        uses: actions/cache@v4
        with:
          path: assets/bin
          key: ${{ runner.os }}-uv-${{ steps.uv-hash.outputs.hash }}

      - name: Download uv
        if: steps.cache-uv.outputs.cache-hit != 'true'
        run: npm run download win

      - name: Build and sign application
        run: npm run package
        env:
          ENABLE_SIGNING: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSSIGN_CONFIG: ${{ secrets.OSSIGN_CONFIG }}

      - name: Upload signed x64 files
        uses: actions/upload-artifact@v4
        with:
          name: signed-win-x64
          path: |
            dist/*.exe
            dist/*.EXE
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error
          retention-days: 7

  # Windows ARM64 (NVIDIA RTX Spark), built natively so node-pty is rebuilt for arm64 and the bundled uv is the
  # aarch64 binary. LAUNCHER_WIN_ARCH=arm64 makes the launcher's electron-builder config name the installer
  # "... Setup <version>-arm64.exe" and put the build on the `latest-arm64` update channel (latest-arm64.yml), so
  # its files never collide with the x64 installer or its latest.yml in the shared release. A launcher ref that
  # predates ARM64 support skips this job's work, so older tags can still be re-signed.
  build-arm64:
    runs-on: windows-11-arm
    
    permissions:
      contents: write

    environment: OSSign
    # The unsigned arm64 build takes ~18 minutes on this runner (native node-pty rebuild, cold caches), plus a few
    # for the Build Tools install below.
    timeout-minutes: 45
    env:
      # Use the VS 2022 Build Tools installed below; node-gyp ignores the image's VS 2026 (see that step).
      npm_config_msvs_version: '2022'

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ github.event.inputs.source_branch }}

      # No npm cache here: an unsupported ref would save a near-empty one under the same lockfile key, and supported
      # refs would then restore it. node_modules is cached below, after a real `npm ci`.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Before anything else that can fail, so a ref without ARM64 support skips the rest: its `npm ci` would need
      # the toolchain below, and a failure in this job blocks the `release` job, x64 included.
      - name: Check that this launcher ref supports Windows ARM64
        id: support
        shell: bash
        # Both must be present: the aarch64 uv (package.json `uv["win-arm64"]`) and the build config's
        # LAUNCHER_WIN_ARCH handling. A ref with the first but not the second would emit arm64 binaries under the
        # x64 names and manifest, which the launcher's wait loop would then attach for x64 users.
        run: |
          if node -e "process.exit(require('./package.json').uv['win-arm64'] ? 0 : 1)" && grep -q "LAUNCHER_WIN_ARCH" electron-builder.config.ts; then
            echo "supported=true" >> $GITHUB_OUTPUT
          else
            echo "supported=false" >> $GITHUB_OUTPUT
            echo "This launcher ref has no Windows ARM64 build; skipping."
          fi

      # The windows-11-arm image ships only Visual Studio 2026 (version 18), which @electron/node-gyp 10.x rejects
      # ("unsupported version: 18"), so the node-pty rebuild - in `npm ci` and again when electron-builder packages -
      # fails with "could not find a version of Visual Studio 2017 or newer". The x64 job sidesteps this by pinning
      # windows-2022; there is no ARM64 image with VS 2022, so install its C++ build tools here, on every run.
      # Same step as the launcher's own build-windows-arm64 job.
      - name: Install Visual Studio 2022 Build Tools
        if: steps.support.outputs.supported == 'true'
        run: |
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vs_buildtools.exe -OutFile "$env:RUNNER_TEMP\vs_buildtools.exe"
          $proc = Start-Process -FilePath "$env:RUNNER_TEMP\vs_buildtools.exe" -Wait -PassThru -ArgumentList @(
            '--quiet', '--wait', '--norestart', '--nocache',
            '--add', 'Microsoft.VisualStudio.Workload.VCTools',
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64',
            # node-pty's binding.gyp sets SpectreMitigation for every Windows target (MSB8040 without these).
            '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.ARM64.Spectre',
            # @electron/node-gyp 10 only accepts an installation that has this component (getToolset), even on ARM64.
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
            '--add', 'Microsoft.VisualStudio.Component.Windows11SDK.26100'
          )
          # 3010 = success, reboot required (not needed for the build tools to be usable).
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { throw "vs_buildtools.exe exited with $($proc.ExitCode)" }

      - name: Generate lockfile hash without version
        if: steps.support.outputs.supported == 'true'
        id: lockfile-hash
        shell: bash
        run: echo "hash=$(node .github/scripts/generate-lockfile-hash.js)" >> $GITHUB_OUTPUT

      - name: Cache node modules
        if: steps.support.outputs.supported == 'true'
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.electron
            ~/.electron-gyp
          key: ${{ runner.os }}-arm64-node-${{ env.NODE_VERSION }}-modules-${{ steps.lockfile-hash.outputs.hash }}

      - name: Install dependencies
        if: steps.support.outputs.supported == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Get UV hash
        if: steps.support.outputs.supported == 'true'
        id: uv-hash
        shell: bash
        run: |
          echo "hash=$(node -e "console.log(require('./package.json').uv['win-arm64'].sha256)")" >> $GITHUB_OUTPUT

      - name: Cache UV binaries
        if: steps.support.outputs.supported == 'true'
        id: cache-uv
        uses: actions/cache@v4
        with:
          path: assets/bin
          key: ${{ runner.os }}-arm64-uv-${{ steps.uv-hash.outputs.hash }}

      - name: Download uv
        if: steps.support.outputs.supported == 'true' && steps.cache-uv.outputs.cache-hit != 'true'
        run: npm run download win-arm64

      - name: Build and sign application
        if: steps.support.outputs.supported == 'true'
        run: npm run package -- --arm64
        env:
          LAUNCHER_WIN_ARCH: arm64
          ENABLE_SIGNING: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSSIGN_CONFIG: ${{ secrets.OSSIGN_CONFIG }}

      - name: Verify the build is on the arm64 update channel
        if: steps.support.outputs.supported == 'true'
        shell: bash
        # The whole point of LAUNCHER_WIN_ARCH: an arm64 build that wrote latest.yml would be attached for x64 users.
        run: |
          test -f dist/latest-arm64.yml || { echo "::error::dist/latest-arm64.yml missing: the arm64 build did not use its own update channel"; exit 1; }
          test ! -f dist/latest.yml || { echo "::error::dist/latest.yml present: the arm64 build wrote the x64 manifest"; exit 1; }
          ls dist/*-arm64.exe >/dev/null

      - name: Upload signed arm64 files
        if: steps.support.outputs.supported == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-win-arm64
          path: |
            dist/*.exe
            dist/*.EXE
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error
          retention-days: 7

  # One release for both architectures, published only when every build succeeded.
  release:
    needs: [build, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download signed files
        uses: actions/download-artifact@v4
        with:
          pattern: signed-win-*
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.EXE
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          name: ${{ github.event.inputs.release_name }}
          tag_name: ${{ github.run_id }}
          body: |
            <img src="https://github.com/ossign.png" alt="OSSign Logo" width="100" height="100" />
            # Signed Release ${{ github.event.inputs.release_name }}
            
            These are the distributable files for the signed release of ${{ env.SOURCE_REPOSITORY_NAME }} ${{ github.event.inputs.release_name }}

            The source code was fetched from https://github.com/${{ env.SOURCE_REPOSITORY }}@${{ github.event.inputs.source_branch }}

